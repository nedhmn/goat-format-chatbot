<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="Built on a 10px unit, not an 8px grid: 2.5 / 5 / 10 / 15 / 20 / 30." -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--color-bg);
      }
      body {
        padding: 18px 20px;
        box-sizing: border-box;
        font: var(--type-ui);
        color: var(--color-text-primary);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .sw {
        width: 104px;
      }
      .chip {
        height: 56px;
        border-radius: 6px;
        border: 1px solid var(--color-border);
      }
      .nm {
        font: var(--type-code);
        font-size: 11px;
        margin-top: 6px;
        display: block;
        color: var(--color-text-primary);
      }
      .hx {
        font: var(--type-code);
        font-size: 11px;
        color: var(--color-text-muted);
        display: block;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; gap: 22px; align-items: flex-end">
      <div style="text-align: center">
        <div
          style="
            width: 2.5px;
            height: 2.5px;
            background: var(--ink);
            border-radius: 2px;
            margin: 0 auto 8px;
          "
        ></div>
        <div style="font: var(--type-code); font-size: 11px">--spacing-xs</div>
        <div style="font: var(--type-code); font-size: 11px; color: var(--color-text-muted)">
          2.5px
        </div>
      </div>
      <div style="text-align: center">
        <div
          style="
            width: 5px;
            height: 5px;
            background: var(--ink);
            border-radius: 2px;
            margin: 0 auto 8px;
          "
        ></div>
        <div style="font: var(--type-code); font-size: 11px">--spacing-sm</div>
        <div style="font: var(--type-code); font-size: 11px; color: var(--color-text-muted)">
          5px
        </div>
      </div>
      <div style="text-align: center">
        <div
          style="
            width: 10px;
            height: 10px;
            background: var(--ink);
            border-radius: 2px;
            margin: 0 auto 8px;
          "
        ></div>
        <div style="font: var(--type-code); font-size: 11px">--spacing-md</div>
        <div style="font: var(--type-code); font-size: 11px; color: var(--color-text-muted)">
          10px
        </div>
      </div>
      <div style="text-align: center">
        <div
          style="
            width: 15px;
            height: 15px;
            background: var(--ink);
            border-radius: 2px;
            margin: 0 auto 8px;
          "
        ></div>
        <div style="font: var(--type-code); font-size: 11px">--spacing-lg</div>
        <div style="font: var(--type-code); font-size: 11px; color: var(--color-text-muted)">
          15px
        </div>
      </div>
      <div style="text-align: center">
        <div
          style="
            width: 20px;
            height: 20px;
            background: var(--ink);
            border-radius: 2px;
            margin: 0 auto 8px;
          "
        ></div>
        <div style="font: var(--type-code); font-size: 11px">--spacing-xl</div>
        <div style="font: var(--type-code); font-size: 11px; color: var(--color-text-muted)">
          20px
        </div>
      </div>
      <div style="text-align: center">
        <div
          style="
            width: 30px;
            height: 30px;
            background: var(--ink);
            border-radius: 2px;
            margin: 0 auto 8px;
          "
        ></div>
        <div style="font: var(--type-code); font-size: 11px">--spacing-2xl</div>
        <div style="font: var(--type-code); font-size: 11px; color: var(--color-text-muted)">
          30px
        </div>
      </div>
    </div>
  </body>
</html>
