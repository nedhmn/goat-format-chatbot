<!-- @dsCard group="Colors" viewport="700x150" name="Text on ground" subtitle="Primary, secondary at 60%, faint at 50%: light and dark." -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--color-bg);
      }
      body {
        padding: 18px 20px;
        box-sizing: border-box;
        font: var(--type-ui);
        color: var(--color-text-primary);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .sw {
        width: 104px;
      }
      .chip {
        height: 56px;
        border-radius: 6px;
        border: 1px solid var(--color-border);
      }
      .nm {
        font: var(--type-code);
        font-size: 11px;
        margin-top: 6px;
        display: block;
        color: var(--color-text-primary);
      }
      .hx {
        font: var(--type-code);
        font-size: 11px;
        color: var(--color-text-muted);
        display: block;
      }
    </style>
  </head>
  <body>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
      <div
        style="
          background: var(--paper);
          border: 1px solid var(--color-border);
          border-radius: 8px;
          padding: 14px;
        "
      >
        <div style="color: #26251e">
          Primary: Ash Blossom negates the effect, not the activation
        </div>
        <div style="color: color-mix(in oklab, #26251e 60%, transparent)">
          Secondary: Nov 11, 2026 · Ruling
        </div>
        <div style="color: color-mix(in oklab, #26251e 50%, transparent)">Faint: 3 min read</div>
      </div>
      <div
        style="
          background: var(--soot);
          border: 1px solid color-mix(in oklab, #edecec 10%, transparent);
          border-radius: 8px;
          padding: 14px;
        "
      >
        <div style="color: #edecec">
          Primary: Ash Blossom negates the effect, not the activation
        </div>
        <div style="color: color-mix(in oklab, #edecec 60%, transparent)">
          Secondary: Nov 11, 2026 · Ruling
        </div>
        <div style="color: color-mix(in oklab, #edecec 50%, transparent)">Faint: 3 min read</div>
      </div>
    </div>
  </body>
</html>
