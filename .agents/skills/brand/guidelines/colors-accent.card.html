<!-- @dsCard group="Colors" viewport="700x140" name="Accent & semantics" subtitle="One orange accent; semantic tints are always the hue at 15% via color-mix." -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--color-bg);
      }
      body {
        padding: 18px 20px;
        box-sizing: border-box;
        font: var(--type-ui);
        color: var(--color-text-primary);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .sw {
        width: 104px;
      }
      .chip {
        height: 56px;
        border-radius: 6px;
        border: 1px solid var(--color-border);
      }
      .nm {
        font: var(--type-code);
        font-size: 11px;
        margin-top: 6px;
        display: block;
        color: var(--color-text-primary);
      }
      .hx {
        font: var(--type-code);
        font-size: 11px;
        color: var(--color-text-muted);
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="sw">
        <div class="chip" style="background: var(--color-accent)"></div>
        <span class="nm">--color-accent</span><span class="hx">#f54e00</span>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--color-accent-bg-strong)"></div>
        <span class="nm">accent-bg-strong</span><span class="hx">25%</span>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--color-success)"></div>
        <span class="nm">--color-success</span><span class="hx">#1f8a65</span>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--color-error)"></div>
        <span class="nm">--color-error</span><span class="hx">#cf2d56</span>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--gold-500)"></div>
        <span class="nm">--gold-500</span><span class="hx">#c08532</span>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--blue-600)"></div>
        <span class="nm">--blue-600</span><span class="hx">#278dcc</span>
      </div>
    </div>
  </body>
</html>
