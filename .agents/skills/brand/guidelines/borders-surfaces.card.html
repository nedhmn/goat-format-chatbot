<!-- @dsCard group="Spacing" viewport="700x160" name="Surfaces" subtitle="Cards are flat: elevated fill, hairline border, no shadow. Only floating windows cast one." -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--color-bg);
      }
      body {
        padding: 18px 20px;
        box-sizing: border-box;
        font: var(--type-ui);
        color: var(--color-text-primary);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .sw {
        width: 104px;
      }
      .chip {
        height: 56px;
        border-radius: 6px;
        border: 1px solid var(--color-border);
      }
      .nm {
        font: var(--type-code);
        font-size: 11px;
        margin-top: 6px;
        display: block;
        color: var(--color-text-primary);
      }
      .hx {
        font: var(--type-code);
        font-size: 11px;
        color: var(--color-text-muted);
        display: block;
      }
    </style>
  </head>
  <body>
    <div style="display: flex; gap: 16px">
      <div
        style="
          flex: 1;
          background: var(--color-bg-elevated);
          border: 1px solid var(--color-border);
          border-radius: 10px;
          padding: 14px;
        "
      >
        <div style="font-size: 14px">Content card</div>
        <div style="font-size: 13px; color: var(--color-text-muted); margin-top: 4px">
          hairline · no shadow
        </div>
      </div>
      <div
        style="
          flex: 1;
          background: var(--color-bg);
          border: 1px solid var(--color-border-bright);
          border-radius: 10px;
          padding: 14px;
        "
      >
        <div style="font-size: 14px">Outlined</div>
        <div style="font-size: 13px; color: var(--color-text-muted); margin-top: 4px">
          border-bright · 20% ink
        </div>
      </div>
      <div
        style="
          flex: 1;
          background: var(--color-bg);
          border: 1px solid var(--color-border);
          border-radius: 10px;
          padding: 14px;
          box-shadow: var(--shadow-window);
        "
      >
        <div style="font-size: 14px">Floating window</div>
        <div style="font-size: 13px; color: var(--color-text-muted); margin-top: 4px">
          the only shadow
        </div>
      </div>
    </div>
  </body>
</html>
