<!-- @dsCard group="Colors" viewport="700x140" name="Neutrals: warm paper" subtitle="Every neutral is mixed toward olive. No pure grey exists in the brand." -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--color-bg);
      }
      body {
        padding: 18px 20px;
        box-sizing: border-box;
        font: var(--type-ui);
        color: var(--color-text-primary);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .sw {
        width: 104px;
      }
      .chip {
        height: 56px;
        border-radius: 6px;
        border: 1px solid var(--color-border);
      }
      .nm {
        font: var(--type-code);
        font-size: 11px;
        margin-top: 6px;
        display: block;
        color: var(--color-text-primary);
      }
      .hx {
        font: var(--type-code);
        font-size: 11px;
        color: var(--color-text-muted);
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="sw">
        <div class="chip" style="background: var(--paper)"></div>
        <span class="nm">--paper</span><span class="hx">#f7f7f4</span>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--paper-2)"></div>
        <span class="nm">--paper-2</span><span class="hx">#f2f1ed</span>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--paper-3)"></div>
        <span class="nm">--paper-3</span><span class="hx">#ebeae5</span>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--paper-4)"></div>
        <span class="nm">--paper-4</span><span class="hx">#e6e5e0</span>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--ink)"></div>
        <span class="nm">--ink</span><span class="hx">#26251e</span>
      </div>
      <div class="sw">
        <div class="chip" style="background: var(--soot)"></div>
        <span class="nm">--soot</span><span class="hx">#14120b</span>
      </div>
    </div>
  </body>
</html>
