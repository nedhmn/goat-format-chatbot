<!-- @dsCard group="Type" viewport="700x170" name="Eyebrow / title / lede" subtitle="One sans voice at three sizes. The lede is --font-prose at 17.28, ink at 55-60%." -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--color-bg);
      }
      body {
        padding: 18px 20px;
        box-sizing: border-box;
        font: var(--type-ui);
        color: var(--color-text-primary);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .sw {
        width: 104px;
      }
      .chip {
        height: 56px;
        border-radius: 6px;
        border: 1px solid var(--color-border);
      }
      .nm {
        font: var(--type-code);
        font-size: 11px;
        margin-top: 6px;
        display: block;
        color: var(--color-text-primary);
      }
      .hx {
        font: var(--type-code);
        font-size: 11px;
        color: var(--color-text-muted);
        display: block;
      }
    </style>
  </head>
  <body>
    <div style="max-width: 600px">
      <div
        style="
          font-family: var(--font-gothic);
          font-size: 14px;
          line-height: 21px;
          letter-spacing: 0.14px;
          color: var(--color-text-muted);
        "
      >
        Trusted every day by teams that build world-class software
      </div>
      <div
        style="
          font-family: var(--font-gothic);
          font-size: 26px;
          line-height: 32.5px;
          letter-spacing: -0.325px;
          margin-top: 8px;
        "
      >
        Ash Blossom negates the effect, not the activation
      </div>
      <div
        style="
          font-family: var(--font-prose);
          font-size: 17.28px;
          line-height: 23.328px;
          color: rgba(38, 37, 30, 0.55);
          margin-top: 10px;
        "
      >
        We are a group of researchers, engineers, and technologists inventing at the edge of what's
        useful and possible.
      </div>
    </div>
  </body>
</html>
